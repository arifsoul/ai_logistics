databases:
  - name: logistics-db
    databaseName: logistics
    user: logistics
    plan: free

services:
  - type: web
    name: logistics-backend
    env: python
    plan: free
    rootDir: .
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: logistics-db
          property: connectionString
      - key: API_KEY
        sync: false
      - key: AI_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta/openai/"
      - key: AI_MODEL
        value: "gemini-flash-latest"
      - key: EMBEDDING_MODEL
        value: "gemini-embedding-001"
      - key: EMBEDDING_DIM
        value: "3072"
      - key: SQL_TIMEOUT_MS
        value: "5000"
      - key: MAX_UNIQUE_VALUES
        value: "50"
      - key: SECRET_KEY
        generateValue: true
      - key: SUPER_USERNAME
        value: "admin"
      - key: SUPER_PASSWORD
        value: "admin"
      - key: CORS_ORIGINS
        value: "https://your-netlify-site.netlify.app"
