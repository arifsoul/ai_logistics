name: Keep Supabase Alive

# Supabase pauses Free Tier projects after 7 days without database activity.
# Two pings per week gives a wide safety margin over that window.
on:
  schedule:
    # 00:00 UTC every Sunday (0) and Thursday (4).
    - cron: "0 0 * * 0,4"
  workflow_dispatch:

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_ANON_KEY repository secrets are not set."
            exit 1
          fi

          # Trailing slash in the URL would produce a double slash after /rest/v1.
          base_url="${SUPABASE_URL%/}"
          endpoint="${base_url}/rest/v1/orders?select=order_id&limit=1"

          # -f makes curl exit non-zero on 4xx/5xx instead of silently succeeding.
          response="$(curl -fsS --retry 3 --retry-delay 5 --max-time 30 \
            "${endpoint}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")"

          echo "Supabase responded: ${response}"
          echo "Heartbeat OK - database activity recorded."
